name: Keliaineiston keruu
on:
  schedule:
    - cron: '17,47 * * * *'   # 30 min välein (UTC); GitHub voi viivästää ajoa muutamia minuutteja
  workflow_dispatch:        # käsin käynnistys: Actions → Keliaineiston keruu → Run workflow
permissions:
  contents: write
concurrency: keli-data
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node collector/collect.mjs
      - name: Tallenna aineisto säilöön
        run: |
          git config user.name "keli-bot"
          git config user.email "keli-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Keliaineisto $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull --rebase --autostash && git push && exit 0; sleep $((i*5)); done
          exit 1
