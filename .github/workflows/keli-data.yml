name: Keliaineiston keruu
# Laskentakoodi haetaan yksityisestä säilöstä (Sambbor/Vantaakeli-laskenta) lukuavaimella CODE_TOKEN; tähän säilöön tallennetaan vain data/.
# pg1 (21.10.2026): sivu julkaistaan tästä ajosta (GitHub Pages: lähde GitHub Actions). Pohdintatiedostot (data/pohdinta.json,
# salo/data/pohdinta.json) menevät vain julkaisuun, eivät säilön historiaan – ne lasketaan joka ajo kokonaan uudelleen (~0,9 Mt).
on:
  schedule:
    - cron: '17,47 * * * *'   # varalla; varsinainen tahti Keruun ajastimesta (ajastin.yml), ks. vahti-työ
  workflow_dispatch:
    inputs:
      tila:
        description: 'taysi = keruu, tallennus ja julkaisu; kevyt = vain liukkauslaskenta (pohdinta) ja julkaisu'
        type: choice
        options: [taysi, kevyt]
        default: taysi
# ka2 (30.10.2026, Samuli): sivun laskenta 10 min välein. Keruun ajastin käynnistää täyden ajon :17 ja :47 UTC ja kevyen
# ajon :07, :27, :37 ja :57. Kevyt ajo ei kerää, tallenna säilöön eikä lähetä puhelinilmoituksia – se vain laskee pohdinnan
# (liukkausindeksi, toimenpide-ehdotus) uudelleen tuoreilla mittauksilla ja julkaisee sivun. Säilö ei siis kasva.
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: keli-data
jobs:
  # ka1 (30.10.2026): Keruun ajastin (ajastin.yml) käynnistää keruun tasan :17/:47. Ajastettu (schedule) ajo on varalla:
  # se ohitetaan, jos käsin/ajastimella käynnistetty keruu on alkanut alle 35 min sitten.
  vahti:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      aja: ${{ steps.v.outputs.aja }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          aja=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh run list --workflow keli-data.yml --event workflow_dispatch --limit 5 --json createdAt --jq '[.[] | select(now - (.createdAt | fromdateiso8601) < 2100)] | length' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then aja=false; echo "Ajastin hoitaa keruun – ajastettu varakeruu ohitetaan"; fi
          fi
          echo "aja=$aja" >> "$GITHUB_OUTPUT"
  collect:
    needs: vahti
    if: needs.vahti.outputs.aja == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Hae laskentakoodi (yksityinen säilö)
        uses: actions/checkout@v5
        with:
          repository: Sambbor/Vantaakeli-laskenta
          token: ${{ secrets.CODE_TOKEN }}
          path: .laskenta
          sparse-checkout: |
            collector
            laskenta.html
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Edellinen pohdinta varalle (jos laskenta epäonnistuu, sivu näyttää vanhan ja varoittaa)
        continue-on-error: true
        run: |
          mkdir -p data salo/data
          curl -fsS -m 30 -o data/pohdinta.json https://sambbor.github.io/Vantaakeli/data/pohdinta.json || true
          curl -fsS -m 30 -o salo/data/pohdinta.json https://sambbor.github.io/Vantaakeli/salo/data/pohdinta.json || true
          # os1: osuvuus (osuma.json) lasketaan vain täydessä ajossa eikä tallennu säilöön; kevyt ajo julkaisee edellisen
          curl -fsS -m 30 -o data/osuma.json https://sambbor.github.io/Vantaakeli/data/osuma.json || true
          curl -fsS -m 30 -o salo/data/osuma.json https://sambbor.github.io/Vantaakeli/salo/data/osuma.json || true
      - name: Keruu ja liukkausennuste
        if: inputs.tila != 'kevyt'
        run: node .laskenta/collector/collect.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Pohdinta sivulle (laskentasivu Chromessa ilman näyttöä)
        continue-on-error: true
        run: |
          npm i --prefix .laskenta --no-save --no-audit --no-fund playwright-core@1.48.2 >/dev/null 2>&1
          node .laskenta/collector/pohdinta.mjs .laskenta/laskenta.html . data/pohdinta.json
        env:
          CHROME_CHANNEL: chrome
      # ur1 (21.10.2026): Salon urakka pilottina – sama koodi, data kansioon salo/data, sivu ?u=salo. Virhe ei estä Vantaan tallennusta.
      - name: Salo (pilotti) – keruu
        if: inputs.tila != 'kevyt'
        continue-on-error: true
        working-directory: salo
        run: mkdir -p data && node ../.laskenta/collector/collect.mjs
        env:
          URAKKA: salo
      - name: Salo (pilotti) – pohdinta
        continue-on-error: true
        run: node .laskenta/collector/pohdinta.mjs .laskenta/laskenta.html . salo/data/pohdinta.json
        env:
          URAKKA: salo
          CHROME_CHANNEL: chrome
      # lv2 (22.10.2026): sivun lähdepalkin tila (pohdinta.json → src) myös säilöön, koska aamuanalyysi ei pääse julkiselle sivulle.
      # data/lahteet.json = viimeisin tila, data/lahteet-YYYY-MM.csv = rivi jokaisesta ajosta (myös yöllä ohimenevät viat näkyvät).
      - name: Lähteiden tila säilöön (aamuanalyysin vikavahti)
        if: inputs.tila != 'kevyt'
        continue-on-error: true
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const KEYS = ['stations','roadfc','finefc','cams','fmi','models','works','radar','traffic'];
          for (const d of ['data', 'salo/data']) {
            try {
              const p = JSON.parse(fs.readFileSync(d + '/pohdinta.json', 'utf8'));
              if (!p.src || !p.t || Date.now() - Date.parse(p.t) > 20 * 60e3) { console.log(d + ': ei tuoretta pohdintaa, lähteitä ei tallennettu'); continue; }
              fs.writeFileSync(d + '/lahteet.json', JSON.stringify({t: p.t, src: p.src}, null, 1));
              const f = d + '/lahteet-' + p.t.slice(0, 7) + '.csv';
              if (!fs.existsSync(f)) fs.writeFileSync(f, 't,' + KEYS.join(',') + '\n');
              const cell = v => v ? (v.status + ' ' + (v.detail || '')).replace(/[",\r\n]/g, ' ').trim() : '';
              fs.appendFileSync(f, p.t + ',' + KEYS.map(k => cell(p.src[k])).join(',') + '\n');
            } catch (e) { console.log(d + ': ' + e.message); }
          }
          EOF
      - name: Tallenna aineisto säilöön (ilman pohdintaa)
        if: inputs.tila != 'kevyt'
        run: |
          git config user.name "keli-bot"
          git config user.email "keli-bot@users.noreply.github.com"
          git rm -q --cached --ignore-unmatch data/pohdinta.json salo/data/pohdinta.json data/osuma.json salo/data/osuma.json
          git add data
          git add salo/data 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Keliaineisto $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull --rebase --autostash && git push && exit 0; sleep $((i*5)); done
          exit 1
      - name: Kokoa julkaisu (säilön tiedostot + pohdinta; ei laskentakoodia)
        run: |
          rm -rf _site && mkdir _site
          git ls-files -z | grep -zv '^\.github/' | xargs -0 cp --parents -t _site
          for f in data/pohdinta.json salo/data/pohdinta.json data/osuma.json salo/data/osuma.json; do [ -s "$f" ] && cp --parents "$f" _site/ || echo "puuttuu: $f"; done
          test ! -e _site/.laskenta && test -s _site/index.html
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Julkaise sivu
        id: deploy
        uses: actions/deploy-pages@v4
